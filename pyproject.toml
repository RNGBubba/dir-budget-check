[project]
name = "dir-budget"
version = "0.1.0"
description = "Fail-fast directory byte budgets for CI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dir-budget = "dirbudget.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dirbudget"]
